[package]
name = "radio-replay-core"
version = "0.8.0"
edition = "2021"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
lofty = "0.25"
rusqlite = { version = "0.38", features = ["bundled"] }

url = "2.5"
percent-encoding = "2.3"
encoding_rs = "0.8"

radio-replay-network = { path = "../network" }
