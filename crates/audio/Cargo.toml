[package]
name = "radio-replay-audio"
version = "0.8.0"
edition = "2021"
license = "MIT"

[features]
smoke-test-output = []

[dependencies]
libloading = "0.8"
serde = { version = "1", features = ["derive"] }

radio-replay-network = { path = "../network", features = ["transport"] }

[dev-dependencies]
tempfile = "3"
