[package]
name = "radio-replay-desktop"
version = "0.3.7"
edition = "2021"
license = "MIT"

[features]
native-smoke = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2"
radio-replay-core = { path = "../crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
souvlaki = "0.8.3"
