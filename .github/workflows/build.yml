name: Build and release
on:
  workflow_dispatch:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}
jobs:
  version:
    name: Check release version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - id: version
        run: node scripts/version.mjs
  check:
    name: Check (${{ matrix.os }})
    needs: version
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev libdbus-1-dev patchelf
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: check
      - run: npm ci
      - name: Prepare bundled Windows audio runtime
        if: runner.os == 'Windows'
        run: npm run setup:mpv
      - run: npm run check
      - run: npm run test:playback
      - run: npm run build
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo check -p radio-replay-desktop --locked
      - run: cargo check -p radio-replay-desktop --no-default-features --locked
      - run: cargo check -p radio-replay-desktop --features native-smoke --locked
      - run: cargo check -p radio-replay-desktop --features native-audio,native-smoke --locked
      - name: Native libmpv audio regressions
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          npm run setup:mpv
          node --test tests/runtime-setup.cjs
          $env:RADIO_REPLAY_MPV_LIBRARY = Join-Path $PWD 'vendor/mpv/libmpv-2.dll'
          $env:RADIO_REPLAY_AUDIO_TEST_NULL_OUTPUT = '1'
          cargo test -p radio-replay-audio --locked -- --ignored
      - name: Install browser for integration tests
        if: runner.os == 'Windows'
        run: npx playwright install msedge
      - name: UI and real audio regressions
        if: runner.os == 'Windows'
        run: |
          npm run test:ui
          npm run test:audio
  windows-package:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    name: Package Windows x64
    needs: [version, check]
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-package
      - run: npm ci
      - name: Build installer, portable ZIP and checksums
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: radio-replay-windows-x64
          path: release/${{ needs.version.outputs.version }}/windows-x64/
          if-no-files-found: error
          retention-days: 14
  publish:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [version, windows-package]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: radio-replay-windows-x64
          path: release/windows-x64
      - name: Publish versioned release assets
        shell: bash
        run: |
          set -euo pipefail
          cd release/windows-x64
          sha256sum --check SHA256SUMS.txt
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            flags=(--prerelease --latest=false)
          else
            flags=(--prerelease=false --latest)
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" ./*.exe ./*.zip SHA256SUMS.txt --clobber
            gh release edit "$RELEASE_TAG" --draft=false "${flags[@]}"
          else
            gh release create "$RELEASE_TAG" ./*.exe ./*.zip SHA256SUMS.txt \
              --verify-tag --title "Radio Replay $RELEASE_VERSION" \
              --notes-file "$GITHUB_WORKSPACE/.github/release-notes.md" \
              --generate-notes "${flags[@]}"
          fi
