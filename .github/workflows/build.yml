name: Rust checks and packages
on:
  workflow_dispatch:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev libdbus-1-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: npm ci
      - run: npm run check
      - run: npm run test:playback
      - run: npm run build
      - run: cargo fmt --all -- --check
      - run: cargo test -p radio-replay-core --locked
      - run: cargo check -p radio-replay-desktop --locked
      - name: UI and real audio regressions
        if: runner.os == 'Windows'
        run: |
          npm run test:ui
          npm run test:audio
  windows-package:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run package -- --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: radio-replay-windows-x64
          path: |
            target/release/radio-replay-desktop.exe
            target/release/bundle/nsis/*.exe
