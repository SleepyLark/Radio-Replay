name: Rust preview foundation
on:
  push:
    paths: ['rewrite/**', '.github/workflows/rust-preview.yml']
  pull_request:
    paths: ['rewrite/**', '.github/workflows/rust-preview.yml']
jobs:
  foundation:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: rewrite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rewrite/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: npm ci
      - run: npm run check
      - run: npm run test:playback
      - run: npm run build
      - run: cargo fmt --all -- --check
      - run: cargo test -p radio-replay-core --locked
      - run: cargo check -p radio-replay-desktop --locked
